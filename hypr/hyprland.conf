source = ~/.config/hypr/colors.conf

monitor = ,preferred,auto,1

exec-once = awww-daemon
exec-once = waybar
#exec-once = hyprpaper
exec-once = hypridle
exec-once = dunst
exec-once = blueman-applet
exec-once = nm-applet --indicator
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Classic
env = QT_QPA_PLATFORMTHEME,qt6ct

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
    }
}

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(a8b5c8ff) rgba(7e9ab5ff) 45deg
    col.inactive_border = rgba(2a2d3688)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    inactive_opacity = 0.92
    active_opacity = 1.0

    blur {
        enabled = true
        size = 5
        passes = 3
        new_optimizations = true
        noise = 0.02
        contrast = 0.9
        brightness = 0.8
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000055)
    }
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    bezier = easeIn, 0.7, 0, 0.84, 0
    bezier = spring, 0.34, 1.56, 0.64, 1
    bezier = linear, 0, 0, 1, 1
    animation = windows, 1, 4, spring, slide
    animation = windowsOut, 1, 3, easeIn, slide
    animation = border, 1, 6, easeOut
    animation = borderangle, 1, 60, linear, loop
    animation = fade, 1, 4, easeOut
    animation = workspaces, 1, 4, easeOut, slidevert
    animation = layers, 1, 3, easeOut, slide
}

dwindle {
    preserve_split = true
    smart_resizing = true
}

master {
    new_status = master
    mfact = 0.55
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = true
}

#layerrule = blur, waybar
#layerrule = blur, wofi

#windowrule = suppressevent maximize, class:.*
#windowrule = float, class:pavucontrol
#windowrule = float, class:blueman-manager
#windowrule = float, class:nm-connection-editor
#windowrule = float, title:Picture-in-Picture
#windowrule = pin, title:Picture-in-Picture
#windowrule = opacity 0.92 0.85, class:kitty

$mod = SUPER

bind = $mod, Return, exec, kitty
bind = $mod, Space, exec, wofi --show drun
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, F, togglefloating
bind = $mod SHIFT, F, fullscreen
#bind = $mod, J, togglesplit
bind = $mod, S, exec, ~/.dotfiles/scripts/settings-menu
bind = $mod SHIFT, W, exec, ~/.dotfiles/scripts/wallpaper-picker
bind = $mod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mod SHIFT, S, exec, grimblast copy area
bind = , Print, exec, grimblast copy output
bind = $mod, A, exec, pkill waybar || waybar
bind = $mod, B, exec, blueman-manager
bind = $mod, N, exec, nm-connection-editor
bind = $mod, E, exec, dolphin
bind = SUPER, W, exec, ~/.config/hypr/scripts/wallpaper_selector.sh
bind = SUPER, L, exec, hyprlock

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

binde = $mod ALT, right, resizeactive, 30 0
binde = $mod ALT, left, resizeactive, -30 0
binde = $mod ALT, up, resizeactive, 0 -30
binde = $mod ALT, down, resizeactive, 0 30

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

