# ╔══════════════════════════════════════════╗
# ║      kitty.conf — minimal/clean          ║
# ╚══════════════════════════════════════════╝

# ── Font ────────────────────────────────────
font_family         JetBrains Mono Regular
bold_font           JetBrains Mono Bold
italic_font         JetBrains Mono Italic
bold_italic_font    JetBrains Mono Bold Italic

font_size           12.5
adjust_line_height  3
adjust_column_width 0
disable_ligatures   cursor

# ── Cursor ───────────────────────────────────
cursor_shape           beam
cursor_beam_thickness  1.5
cursor_blink_interval  0.5
cursor_stop_blinking_after 10

# ── Scrollback ───────────────────────────────
scrollback_lines 10000

# ── Mouse ────────────────────────────────────
mouse_hide_wait     3.0
url_color           #7e9ab5
url_style           single
open_url_with       default
copy_on_select      no
focus_follows_mouse no

# ── Performance ──────────────────────────────
repaint_delay   8
input_delay     2
sync_to_monitor yes

# ── Bell ─────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0

# ── Window ───────────────────────────────────
remember_window_size   no
initial_window_width   920
initial_window_height  560
window_padding_width   16 18
hide_window_decorations yes
placement_strategy     center

# ── Tabs ─────────────────────────────────────
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
tab_bar_margin_width    0
tab_title_template      " {title} "
active_tab_font_style   bold
inactive_tab_font_style normal

# ── Colors ───────────────────────────────────
# Dark, cold-toned minimal palette

background            #13151e
foreground            #c5cdd9
selection_background  #252838
selection_foreground  #c5cdd9
cursor                #a8b5c8
cursor_text_color     #13151e

# URL hover
url_color             #7e9ab5

# Tabs
active_tab_background   #1c1f2b
active_tab_foreground   #a8b5c8
inactive_tab_background #13151e
inactive_tab_foreground #4a4f66
tab_bar_background      #13151e

# Black
color0  #1c1f2b
color8  #3a3f54

# Red
color1  #c47878
color9  #d08888

# Green
color2  #78c49a
color10 #88d4aa

# Yellow
color3  #c4ae78
color11 #d4be88

# Blue
color4  #7e9ab5
color12 #8eaac5

# Magenta
color5  #a889b5
color13 #b899c5

# Cyan
color6  #78afc4
color14 #88bfd4

# White
color7  #c5cdd9
color15 #d5dde9

# ── Keyboard shortcuts ───────────────────────
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0

# ── Opacity / blur (set via Hyprland rules) ──
background_opacity 0.92
